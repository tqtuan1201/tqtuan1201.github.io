<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One dashboard, different rows for each role</title>
<link rel="stylesheet" href="kit/dashmotion.css">
</head>
<body>
<script type="application/json" id="dm-spec">
{
  "title": "One dashboard, different rows for each role",
  "subtitle": "Superset adds the role's WHERE condition before the query reaches your database.",
  "description": "The dashboard sends the same chart query for every user. Superset checks the RLS rules for the user's role. The national director has no rule and sees all regions. The North manager's query gets WHERE region equals North, and the South manager's query gets WHERE region equals South.",
  "gif": "/images/superset-rls-flow.gif",
  "nodes": [
    { "id": "dashboard", "label": "One dashboard", "detail": "Same chart query", "icon": "chart", "col": 0, "row": 1 },
    { "id": "rls", "label": "RLS rules", "detail": "Checks the user's role", "icon": "filter", "col": 1, "row": 1 },
    { "id": "director", "label": "National director", "detail": "Sees all regions", "icon": "user", "col": 2, "row": 0, "tone": "success" },
    { "id": "north", "label": "North manager", "detail": "Sees North rows only", "icon": "user", "col": 2, "row": 1, "tone": "success" },
    { "id": "south", "label": "South manager", "detail": "Sees South rows only", "icon": "user", "col": 2, "row": 2, "tone": "success" }
  ],
  "edges": [
    { "from": "dashboard", "to": "rls", "label": "SQL" },
    { "from": "rls", "to": "director", "label": "no filter" },
    { "from": "rls", "to": "north", "label": "region = 'North'", "code": true },
    { "from": "rls", "to": "south", "label": "region = 'South'", "code": true }
  ],
  "sequence": [
    { "nodes": ["dashboard"] },
    { "edges": ["dashboard-rls"], "nodes": ["rls"] },
    { "edges": ["rls-director"], "nodes": ["director"] },
    { "edges": ["rls-north"], "nodes": ["north"] },
    { "edges": ["rls-south"], "nodes": ["south"] }
  ]
}
</script>
<script src="kit/dashmotion.js" defer></script>
</body>
</html>
